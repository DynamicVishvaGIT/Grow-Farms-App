<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Inbox</ion-list-header>
          <ion-note>hi&#64;ionicframework.com</ion-note>

          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
    <ion-tabs  #myTabs (ionTabsDidChange)="getSelectedTab()">
      <ion-tab-bar slot="bottom" selectedTab="{{tab_name}}" *ngIf="tab_name =='my-bookings'|| tab_name =='home' || tab_name =='payment-slabs'  || tab_name =='my-profile'|| tab_name =='document-list' || tab_name =='payment-receipt' || tab_name =='scheme-offers' || tab_name =='order-history' || tab_name =='project-lead' || tab_name =='scancounterboy' || tab_name =='passbook' || tab_name =='projectlist' ">
        <ion-tab-button tab="home" class="active">
          <ion-icon name="home"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-tab-button>
      
        <ion-tab-button tab="my-bookings">
          <ion-icon name="document-text"></ion-icon>
          <ion-label>Booking</ion-label>
        </ion-tab-button>
      
        <ion-tab-button tab="payment-slabs">
          <ion-icon name="wallet"></ion-icon>
          <ion-label>Payment</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="document-list">
          <ion-icon name="document"></ion-icon>
          <ion-label>Document</ion-label>
        </ion-tab-button>
      
        <ion-tab-button tab="my-profile">
          <ion-icon name="person"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-tab-button>

      </ion-tab-bar>
    </ion-tabs>
  </ion-split-pane>
</ion-app>
